<div class="board {{ m.status }}">
  <div class="meta">{{ m|match_title }}{% if m.court %} · Campo {{ m.court }}{% endif %}</div>
  <div class="bteam"><span>{{ m.team1_name or '—' }}</span><b>{{ m.score1 }}</b></div>
  <div class="bteam"><span>{{ m.team2_name or '—' }}</span><b>{{ m.score2 }}</b></div>
  <div class="foot">{% if m.status == 'live' %}<span class="badge live">● LIVE</span>
    {% elif m.status == 'finished' %}<span class="badge">Finale</span>
    {% else %}<span class="badge dim">Da giocare {{ m.start_time|when }}</span>{% endif %}</div>
</div>
